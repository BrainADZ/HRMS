# Render Blueprint: web service with persistent uploads. Provision PostgreSQL
# separately and supply DATABASE_URL (prefer the private/internal URL).
services:
  - type: web
    name: brainadz-hrms
    runtime: docker
    plan: starter          # a persistent disk needs a paid instance
    region: singapore      # closest Render region to India
    healthCheckPath: /api/auth/config
    disk:
      name: hrms-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED
        value: empty
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false        # Render asks for it; leave blank to use rule-based screening
